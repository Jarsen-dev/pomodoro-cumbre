<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pomodoro Cumbre</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Figtree:wght@400;600;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: one centered console — pixel scene on top, big timer, controls, small stats. Day sky in light theme, night sky in dark. */
:root{
  --bg:#e9eef2; --panel:#fbfcfd; --ink:#1f2a33; --muted:#5d6b77; --line:#d3dce3;
  --accent:#e2563b; --accent-ink:#ffffff; --rest:#2f8f6b; --chip:#eef2f5;
  --sky1:#8fc6ea; --sky2:#f7d9b0; --mtn:#5b6f86; --mtn2:#7a8ea4; --snow:#ffffff; --grass:#6aa55a; --path:#e8d6a8; --trail:#ffd54a;
  --f-pix:"Press Start 2P", ui-monospace, "Courier New", monospace;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161d; --panel:#1a2029; --ink:#e7edf3; --muted:#97a4b1; --line:#2b3440;
  --accent:#ff6a4d; --accent-ink:#1a0f0c; --rest:#4fc394; --chip:#232b36;
  --sky1:#141c33; --sky2:#3b2f57; --mtn:#2c3a52; --mtn2:#3d4e6a; --snow:#cfd9e6; --grass:#2f5a3a; --path:#8f7f5c; --trail:#ffd54a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161d; --panel:#1a2029; --ink:#e7edf3; --muted:#97a4b1; --line:#2b3440;
  --accent:#ff6a4d; --accent-ink:#1a0f0c; --rest:#4fc394; --chip:#232b36;
  --sky1:#141c33; --sky2:#3b2f57; --mtn:#2c3a52; --mtn2:#3d4e6a; --snow:#cfd9e6; --grass:#2f5a3a; --path:#8f7f5c; --trail:#ffd54a;
  color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
canvas{display:block;width:100%;aspect-ratio:16/9;image-rendering:pixelated;max-width:100%}
.modes{display:flex;gap:6px;padding:12px 12px 0;flex-wrap:wrap}
.mode{font:600 13px var(--f-body);border:1px solid var(--line);background:var(--chip);color:var(--muted);padding:7px 12px;border-radius:999px;cursor:pointer}
.mode[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.timer{font-family:var(--f-pix);font-size:clamp(40px,13vw,68px);text-align:center;padding:18px 8px 6px;letter-spacing:2px;font-variant-numeric:tabular-nums}
.status{text-align:center;color:var(--muted);font-size:14px;min-height:20px;padding:0 12px}
.controls{display:flex;gap:10px;justify-content:center;padding:16px 12px 18px;flex-wrap:wrap}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--trail);outline-offset:2px}
.primary{font:12px var(--f-pix);background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:16px 26px;box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.primary:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.ghost{font:600 14px var(--f-body);background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.cycle{display:flex;gap:6px;align-items:center}
.dot{width:14px;height:14px;border-radius:3px;background:var(--chip);border:1px solid var(--line)}
.dot.on{background:var(--accent);border-color:var(--accent)}
.lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.big{font-family:var(--f-pix);font-size:14px}
details{padding:0 14px 12px;border-top:1px solid var(--line)}
summary{padding:12px 0;cursor:pointer;font-weight:600;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.grid label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.grid input{font:600 15px var(--f-body);padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:0}
.check{flex-direction:row!important;align-items:center;gap:8px!important}
.note{font-size:12px;color:var(--muted);margin:10px 0 0}
</style>
</head>
<body>

<div class="wrap">
  <div class="card">
    <canvas id="scene" width="192" height="108" aria-label="Escena: un explorador sube la montaña hacia la bandera de tu meta"></canvas>
    <div class="modes" role="group" aria-label="Modo">
      <button class="mode" id="m-focus" aria-pressed="true">Enfoque</button>
      <button class="mode" id="m-short" aria-pressed="false">Descanso</button>
      <button class="mode" id="m-long" aria-pressed="false">Descanso largo</button>
    </div>
    <div class="timer" id="time" aria-live="off">25:00</div>
    <div class="status" id="status">Listo para subir. Presiona Iniciar.</div>
    <div class="controls">
      <button class="primary" id="start">INICIAR</button>
      <button class="ghost" id="reset">Reiniciar</button>
      <button class="ghost" id="skip">Saltar</button>
    </div>
    <div class="row">
      <div><div class="lbl">Ciclo</div><div class="cycle" id="cycle"></div></div>
      <div style="text-align:center"><div class="lbl">Hoy</div><div class="big" id="today">0</div></div>
      <div style="text-align:right"><div class="lbl">Total</div><div class="big" id="total">0</div></div>
    </div>
    <details>
      <summary>Ajustes</summary>
      <div class="grid">
        <label>Meta en la bandera<input id="goal" maxlength="10" value="B2"></label>
        <label>Enfoque (min)<input id="d-focus" type="number" min="1" max="120" value="25"></label>
        <label>Descanso (min)<input id="d-short" type="number" min="1" max="60" value="5"></label>
        <label>Descanso largo (min)<input id="d-long" type="number" min="1" max="60" value="15"></label>
        <label class="check"><input id="sound" type="checkbox" checked> Sonido</label>
        <label class="check"><input id="auto" type="checkbox"> Encadenar automático</label>
      </div>
      <div class="controls" style="padding-bottom:4px"><button class="ghost" id="test">▶ Probar jingle de meta</button></div>
      <p class="note">Al terminar cada pomodoro, regístralo en Sesiones Pomodoro de tu Notion. Los contadores se guardan solo en este navegador.</p>
    </details>
  </div>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const todayKey=()=>new Date().toISOString().slice(0,10);

/* ---------- state ---------- */
const S={mode:'focus',running:false,endAt:0,remaining:0,total:0,cycle:store.get('pc_cycle',0),
  stats:store.get('pc_stats',{day:todayKey(),today:0,total:0}),phase:'idle',celebrateT:0};
if(S.stats.day!==todayKey()){S.stats.day=todayKey();S.stats.today=0}
const cfg=store.get('pc_cfg',{goal:'B2',focus:25,short:5,long:15,sound:true,auto:false});
$('goal').value=cfg.goal;$('d-focus').value=cfg.focus;$('d-short').value=cfg.short;$('d-long').value=cfg.long;$('sound').checked=cfg.sound;$('auto').checked=cfg.auto;
function saveCfg(){cfg.goal=($('goal').value||'META').toUpperCase();cfg.focus=+$('d-focus').value||25;cfg.short=+$('d-short').value||5;cfg.long=+$('d-long').value||15;cfg.sound=$('sound').checked;cfg.auto=$('auto').checked;store.set('pc_cfg',cfg);if(!S.running)setMode(S.mode,true)}
['goal','d-focus','d-short','d-long','sound','auto'].forEach(id=>$(id).addEventListener('change',saveCfg));

const dur=m=>60*1000*(m==='focus'?cfg.focus:m==='short'?cfg.short:cfg.long);
function setMode(m,keep){S.mode=m;S.running=false;S.total=dur(m);S.remaining=S.total;S.phase='idle';
  ['focus','short','long'].forEach(x=>$('m-'+x).setAttribute('aria-pressed',x===m));
  $('start').textContent='INICIAR';
  $('status').textContent=m==='focus'?'Listo para subir. Presiona Iniciar.':'Momento de descansar junto a la fogata.';
  render()}
$('m-focus').onclick=()=>setMode('focus');$('m-short').onclick=()=>setMode('short');$('m-long').onclick=()=>setMode('long');

let wake=null;
async function lock(){try{wake=await navigator.wakeLock?.request('screen')}catch(e){}}
function unlock(){try{wake?.release()}catch(e){};wake=null}

$('start').onclick=()=>{ensureAudio();
  if(S.running){S.remaining=Math.max(0,S.endAt-Date.now());S.running=false;$('start').textContent='SEGUIR';$('status').textContent='En pausa. El explorador espera.';unlock()}
  else{if(S.remaining<=0)S.remaining=S.total;S.endAt=Date.now()+S.remaining;S.running=true;S.phase='run';$('start').textContent='PAUSA';
    $('status').textContent=S.mode==='focus'?'Subiendo hacia '+cfg.goal+'… enfócate en una sola tarea.':'Descansa: agua, estira, mira lejos.';lock()}
  render()};
$('reset').onclick=()=>{unlock();setMode(S.mode)};
$('skip').onclick=()=>{unlock();finish(true)};
$('test').onclick=()=>{ensureAudio();playGoal();S.phase='celebrate';S.celebrateT=performance.now();spawnConfetti()};

function finish(skipped){S.running=false;S.remaining=0;
  if(S.mode==='focus'){
    if(!skipped){S.cycle=(S.cycle%4)+1;store.set('pc_cycle',S.cycle);S.stats.today++;S.stats.total++;store.set('pc_stats',S.stats);
      if(cfg.sound)playGoal();S.phase='celebrate';S.celebrateT=performance.now();spawnConfetti();
      $('status').textContent='¡Cumbre alcanzada! Pomodoro #'+S.stats.today+' de hoy. Regístralo en Notion.'}
    const next=S.cycle>=4&&!skipped?'long':'short';
    setTimeout(()=>{const keep=S.phase;setMode(next);if(!skipped){S.phase=keep}if(cfg.auto)$('start').click()},skipped?0:4200);
  }else{
    if(!skipped&&cfg.sound)playBreak();
    if(S.mode==='long')S.cycle=0,store.set('pc_cycle',0);
    setMode('focus');if(!skipped){$('status').textContent='Descanso terminado. A seguir subiendo.';if(cfg.auto)$('start').click()}
  }
  unlock();render()}

/* ---------- audio: original chiptune ---------- */
let ac=null;
function ensureAudio(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume()}
const N=n=>440*Math.pow(2,(n-69)/12);
function tone(t,midi,len,type,vol,vib){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(N(midi),t);
  if(vib){const l=ac.createOscillator(),lg=ac.createGain();l.frequency.value=7;lg.gain.value=N(midi)*0.012;l.connect(lg);lg.connect(o.frequency);l.start(t+0.12);l.stop(t+len)}
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+0.008);g.gain.setValueAtTime(vol,t+len*0.7);g.gain.exponentialRampToValueAtTime(0.0001,t+len);
  o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+len+0.02)}
function playGoal(){if(!ac)return;const t=ac.currentTime+0.05,s=0.085;
  // "Cumbre" jingle: rising hop, little bounce, sparkle landing
  const lead=[[67,0,1],[71,1,1],[74,2,1],[79,3,2],[76,5,1],[79,6,1],[81,7,1],[83,8,1],[86,9,6]];
  lead.forEach(([m,a,l])=>tone(t+a*s,m,l*s+(l>3?0.35:0.02),'square',0.07,l>3));
  [[43,0,3],[50,3,3],[55,6,3],[47,9,6]].forEach(([m,a,l])=>tone(t+a*s,m,l*s+0.1,'triangle',0.16));
  [98,103,107,110].forEach((m,i)=>tone(t+(10+i*0.5)*s,m,0.07,'square',0.025))}
function playBreak(){if(!ac)return;const t=ac.currentTime+0.05;[[72,0],[76,0.12],[79,0.24]].forEach(([m,a])=>tone(t+a,m,0.22,'triangle',0.12))}

/* ---------- pixel scene ---------- */
const cv=$('scene'),cx=cv.getContext('2d'),W=192,H=108;cx.imageSmoothingEnabled=false;
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const PATH=[[10,98],[58,95],[40,85],[92,79],[72,67],[118,58],[102,46],[134,38],[146,28],[150,22]];
const seg=[];let L=0;for(let i=1;i<PATH.length;i++){const[a,b]=[PATH[i-1],PATH[i]];const d=Math.hypot(b[0]-a[0],b[1]-a[1]);seg.push([a,b,d]);L+=d}
function at(p){let d=p*L;for(const[a,b,s]of seg){if(d<=s){const k=d/s;return[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k,b[0]>=a[0]]}d-=s}const e=PATH[PATH.length-1];return[e[0],e[1],true]}
const stars=Array.from({length:40},(_,i)=>[(i*53)%W,(i*29)%55,(i%3)]);
let confetti=[];
function spawnConfetti(){const cols=['#ff6a4d','#ffd54a','#4fc394','#6ab7ff','#d78bff'];confetti=[];for(let i=0;i<70;i++)confetti.push({x:150,y:10,vx:(Math.random()-.5)*2.4,vy:-Math.random()*2.2-0.4,c:cols[i%5],l:90+Math.random()*60})}
function px(x,y,w,h,c){cx.fillStyle=c;cx.fillRect(Math.round(x),Math.round(y),w,h)}
function dashed(pts,color,upTo){cx.fillStyle=color;let walked=0;for(const[a,b,s]of seg){for(let d=0;d<s;d+=3){if(upTo!=null&&walked+d>upTo)return;const k=d/s;cx.fillRect(Math.round(a[0]+(b[0]-a[0])*k),Math.round(a[1]+(b[1]-a[1])*k),2,1)}walked+=s}}
function hiker(x,y,f,frame,jump,sit){x=Math.round(x);y=Math.round(y-(jump||0));const s=f?1:-1;
  const body='#e2563b',skin='#f2c39a',pack='#3d5a80',dark='#1f2a33';
  if(sit){px(x-3,y-6,6,4,body);px(x-2,y-10,4,4,skin);px(x-3,y-11,6,2,dark);px(x-4,y-2,8,2,pack);return}
  px(x-2,y-11,5,4,skin);px(x-3,y-12,7,2,dark);px(x+(s>0?1:-1),y-10,1,1,dark);
  px(x-2,y-7,5,4,body);px(x-(s>0?4:-2),y-7,2,4,pack);
  const lg=frame%2;px(x-2+(lg?1:0),y-3,2,3,dark);px(x+1-(lg?1:0),y-3,2,3,dark);
  px(x+(s>0?3:-4),y-6,1,5,'#a07b4f')}
function fire(x,y,t){px(x-3,y,7,2,'#6b4a2b');const h=3+Math.round(Math.sin(t/120)*1.5+1);px(x-1,y-h,3,h,'#ff9f1c');px(x,y-h-1,1,2,'#ffd54a')}
function draw(now){
  const g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,css('--sky1'));g.addColorStop(1,css('--sky2'));cx.fillStyle=g;cx.fillRect(0,0,W,H);
  const dark=matchMedia('(prefers-color-scheme: dark)').matches&&document.documentElement.dataset.theme!=='light'||document.documentElement.dataset.theme==='dark';
  if(dark){stars.forEach(([x,y,k])=>{if((Math.floor(now/400)+k)%5)px(x,y,1,1,'#e8eef8')});px(26,12,8,8,'#f4f1d0');px(29,12,5,6,css('--sky1'))}
  else{px(24,12,10,10,'#fff2b8');px(22,14,14,6,'#fff2b8');px(60,18,16,3,'#ffffffcc');px(64,15,9,3,'#ffffffcc')}
  // back range
  cx.fillStyle=css('--mtn2');cx.beginPath();cx.moveTo(0,75);cx.lineTo(40,48);cx.lineTo(70,66);cx.lineTo(100,40);cx.lineTo(125,60);cx.lineTo(192,46);cx.lineTo(192,108);cx.lineTo(0,108);cx.fill();
  // main mountain
  cx.fillStyle=css('--mtn');cx.beginPath();cx.moveTo(0,104);cx.lineTo(40,90);cx.lineTo(80,72);cx.lineTo(118,50);cx.lineTo(150,20);cx.lineTo(172,40);cx.lineTo(192,58);cx.lineTo(192,108);cx.fill();
  cx.fillStyle=css('--snow');cx.beginPath();cx.moveTo(150,20);cx.lineTo(138,32);cx.lineTo(144,30);cx.lineTo(149,34);cx.lineTo(155,29);cx.lineTo(162,32);cx.fill();
  cx.fillStyle=css('--grass');cx.fillRect(0,100,W,8);
  const focus=S.mode==='focus';
  let p=0;if(S.running||S.remaining<S.total)p=1-Math.max(0,(S.running?S.endAt-Date.now():S.remaining))/S.total;
  const celebrating=S.phase==='celebrate'&&now-S.celebrateT<4200;
  if(celebrating)p=1;
  dashed(PATH,css('--path'));if(focus)dashed(PATH,css('--trail'),p*L);
  // flag
  const raise=celebrating?Math.min(1,(now-S.celebrateT)/700):(focus?0.15+0.85*p*p:0.15);
  px(151,4,1,18,'#eae6dc');const fy=Math.round(17-13*raise);const wave=Math.round(Math.sin(now/180));
  px(152,fy,22,8+wave,'#e2563b');px(152,fy+8+wave,22,1,'#a83a25');
  cx.fillStyle='#ffffff';cx.font='6px "Press Start 2P", monospace';cx.textBaseline='top';cx.fillText(cfg.goal.slice(0,3),154,fy+1);
  // hiker
  if(focus||celebrating){const[x,y,f]=at(Math.min(p,1));const frame=S.running?Math.floor(now/160):0;
    const jump=celebrating?Math.abs(Math.sin((now-S.celebrateT)/140))*5:0;hiker(x,y,f,frame,jump)}
  else{fire(40,98,now);hiker(30,100,true,0,0,true)}
  // confetti
  if(confetti.length){confetti.forEach(c=>{c.x+=c.vx;c.y+=c.vy;c.vy+=0.04;c.l--;if(c.l>0)px(c.x,c.y,2,2,c.c)});confetti=confetti.filter(c=>c.l>0&&c.y<H)}
  if(celebrating&&Math.floor((now-S.celebrateT)/250)%2===0){cx.fillStyle='#ffd54a';cx.font='8px "Press Start 2P", monospace';cx.fillText('¡META!',62,6)}
}
/* ---------- loop ---------- */
const fmt=ms=>{const s=Math.ceil(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function render(){const left=S.running?Math.max(0,S.endAt-Date.now()):S.remaining;$('time').textContent=fmt(left);
  document.title=S.running?fmt(left)+' · '+(S.mode==='focus'?'Enfoque':'Descanso'):'Pomodoro Cumbre';
  $('cycle').innerHTML=[1,2,3,4].map(i=>'<span class="dot'+(i<=S.cycle?' on':'')+'"></span>').join('');
  $('today').textContent=S.stats.today;$('total').textContent=S.stats.total}
function loop(now){if(S.running&&Date.now()>=S.endAt)finish(false);render();draw(now);requestAnimationFrame(loop)}
setMode('focus');requestAnimationFrame(loop);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.running)lock()});
})();
</script>
</body>
</html>
